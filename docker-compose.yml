# Local development only. Nothing here talks to Google Cloud.
# The credentials below belong to this throwaway local database and nothing else.
x-app: &app
  build: .
  image: engines:local
  environment:
    DATABASE_URL: postgres://engines:engines@postgres:5432/engines
    STORAGE: local
    STORAGE_DIR: /data/storage
    PUBLIC_URL: http://localhost:8080
    # Signs local URLs on this machine only. Not a secret of any real system.
    LOCAL_STORAGE_SECRET: local-development-only
    # Signs sign-in sessions on this machine only. Not a secret of any real system.
    AUTH_SECRET: local-development-only-auth-secret-32
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_MODEL_CHEAP: ${AI_MODEL_CHEAP:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  volumes:
    - storage:/data/storage

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: engines
      POSTGRES_PASSWORD: engines
      POSTGRES_DB: engines
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engines -d engines"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["node", "src/shared/db/migrate-cli.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "src/worker/main.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
